[project]
name = "sconixapp"
version = "0.1.0"
description = "Shared backend batteries for Sconix Systems apps"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2.1",
    "structlog>=24.4",
    "httpx>=0.27",
    "redis>=5.1",
    "email-validator>=2.0",
]

[project.optional-dependencies]
jobs = ["arq>=0.26"]
email = ["resend>=2.4"]
billing = ["stripe>=11.1"]
agent = ["anthropic>=0.69"]

[dependency-groups]
# stripe + anthropic here (not just the extras) so billing/agent stay testable
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "aiosqlite>=0.20", "stripe>=11.1", "anthropic>=0.69"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sconixapp"]
